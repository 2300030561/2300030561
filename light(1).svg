<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Saketh — Developer and Cybersecurity Enthusiast</title>
<desc id="desc">Animated light hero banner with cerulean blue and neon rose accents.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF4FB"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#008BC2"/><stop offset="1" stop-color="#E72B91"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#C8D9E8" stroke-width="0.7"/></pattern>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<rect width="1200" height="360" rx="24" fill="url(#grid)" opacity=".8"/>
<circle cx="1020" cy="70" r="150" fill="#00BFFF" opacity=".12"><animate attributeName="r" values="130;160;130" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="180" cy="330" r="170" fill="#FF3CAC" opacity=".09"><animate attributeName="r" values="160;185;160" dur="8s" repeatCount="indefinite"/></circle>
<path d="M40 45H1160" stroke="url(#line)" stroke-width="2" opacity=".9"/>
<circle cx="54" cy="45" r="5" fill="#008BC2" filter="url(#glow)"/>
<circle cx="72" cy="45" r="5" fill="#E72B91" filter="url(#glow)"/>
<circle cx="90" cy="45" r="5" fill="#526579" opacity=".7"/>
<g font-family="Consolas, Monaco, monospace">
  <text x="82" y="115" fill="#007EAE" font-size="17" letter-spacing="4">HELLO WORLD / I'M</text>
  <text x="78" y="183" fill="#101827" font-size="58" font-weight="700">SAKETH</text>
  <rect x="80" y="202" width="420" height="4" rx="2" fill="url(#line)"><animate attributeName="width" values="120;420;320;420" dur="5s" repeatCount="indefinite"/></rect>
  <text x="82" y="244" fill="#334155" font-size="20">CSE STUDENT  <tspan fill="#E72B91">|</tspan>  DEVELOPER</text>
  <text x="82" y="276" fill="#334155" font-size="20">CYBERSECURITY ENTHUSIAST</text>
  <text x="82" y="320" fill="#007EAE" font-size="14">$ build · learn · secure <tspan fill="#E72B91">_</tspan><animate attributeName="opacity" values="1;.35;1" dur="1.3s" repeatCount="indefinite"/></text>
</g>
<g transform="translate(770 94)">
  <rect width="350" height="188" rx="14" fill="#FFFFFF" stroke="#008BC2" stroke-opacity=".8"/>
  <path d="M0 38H350" stroke="#D5E1EC"/>
  <circle cx="20" cy="19" r="4" fill="#E72B91"/><circle cx="35" cy="19" r="4" fill="#008BC2"/><circle cx="50" cy="19" r="4" fill="#526579" opacity=".7"/>
  <g font-family="Consolas, Monaco, monospace" font-size="14">
    <text x="22" y="66" fill="#D51E80">$ whoami</text>
    <text x="22" y="89" fill="#101827">saketh / developer</text>
    <text x="22" y="119" fill="#D51E80">$ focus --list</text>
    <text x="22" y="142" fill="#007EAE">network-security</text>
    <text x="22" y="164" fill="#007EAE">software-development</text>
  </g>
  <rect x="22" y="174" width="8" height="2" fill="#E72B91"><animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/></rect>
</g>
<text x="1115" y="330" text-anchor="end" font-family="Consolas, Monaco, monospace" font-size="12" fill="#526579">JET BLACK • CERULEAN • NEON ROSE</text>
</svg>